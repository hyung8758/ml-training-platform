# 각 학습 Backend와 Job의 구조적 호환 관계를 정의하는 플랫폼 정책이다.
# 실제 학습 구현 완료 여부는 Backend 문서에서 관리하며 Python 코드에 이 목록을 복제하지 않는다.

backends:
  espnet:
    jobs:
      - stt.foundation
      - stt.finetune
      - stt.evaluate
    docker:
      image: ml-platform-espnet

  ms_swift:
    jobs:
      - language.llm.pretrain
      - language.llm.finetune
      - language.embedding.finetune
      - language.reranker.finetune
    docker:
      image: ml-platform-ms-swift

  llama_factory:
    jobs:
      - language.llm.pretrain
      - language.llm.finetune
    docker:
      image: ml-platform-llama-factory

  lightning:
    jobs:
      - stt.foundation
      - stt.finetune
      - language.llm.finetune
      - language.embedding.finetune
    docker:
      image: ml-platform-lightning
