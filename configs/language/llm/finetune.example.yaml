# 28B 이하 LLM Fine-tuning의 공통 상위 설정 예시이며 기본 Backend는 ms-swift이다.
experiment:
  project: ML Training/Language/LLM
  name: llm-lora-finetune-example
job:
  type: language.llm.finetune
backend:
  name: ms_swift
dataset:
  name: instruction_data
  version: v1
  train_path: /mnt/ml-data/llm/instruction_data/v1/train
  valid_path: /mnt/ml-data/llm/instruction_data/v1/valid
model:
  name_or_path: <BASE_MODEL_IDENTIFIER>
training:
  method: lora
  max_seq_length: 2048
  learning_rate: 0.00002
  epochs: 1
resource:
  queue: <CLEARML_QUEUE_NAME>
  gpu_count: 1
output:
  root: llm/finetune/example
