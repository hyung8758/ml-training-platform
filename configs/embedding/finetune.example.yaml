# Embedding 모델 Fine-tuning의 상위 설정 예시이다.
experiment:
  project: ML Training/Embedding Fine-tuning
  name: embedding-finetune-example
dataset:
  name: embedding_pairs
  version: v1
  train_path: /mnt/ml-data/embedding/embedding_pairs/v1/train
  valid_path: /mnt/ml-data/embedding/embedding_pairs/v1/valid
model:
  framework: sentence-transformers
  name_or_path: <BASE_MODEL_IDENTIFIER>
training:
  learning_rate: 0.00002
  epochs: 1
  batch_size: 8
resource:
  queue: <CLEARML_QUEUE_NAME>
  gpu_count: 1
output:
  root: embedding/finetune/example
