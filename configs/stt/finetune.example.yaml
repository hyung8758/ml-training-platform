# 기존 STT Foundation 모델을 시작점으로 사용하는 Fine-tuning 상위 설정 예시이다.
experiment:
  project: ML Training/STT
  name: ko-domain-a-finetune-example
job:
  type: stt.finetune
backend:
  name: espnet
dataset:
  name: ko_domain_a
  version: v1
  train_path: /mnt/ml-data/asr/ko_domain_a/v1/train
  valid_path: /mnt/ml-data/asr/ko_domain_a/v1/valid
base_model:
  task_id: <CLEARML_BASE_TASK_ID_OR_MODEL_IDENTIFIER>
model:
  architecture: conformer
training:
  config_path: <ESPNET_RECIPE_CONFIG_PATH>
  max_epoch: 1
resource:
  queue: <CLEARML_QUEUE_NAME>
  gpu_count: 1
output:
  root: asr/espnet-finetune/ko-domain-a-example
