# STT Foundation 학습의 상위 설정 예시이다. 실제 ESPnet recipe 경로는 운영 환경에서 지정한다.
experiment:
  project: ML Training/STT
  name: ko-general-foundation-example
job:
  type: stt.foundation
backend:
  name: espnet
dataset:
  name: ko_general
  version: v1
  train_path: /mnt/ml-data/asr/ko_general/v1/train
  valid_path: /mnt/ml-data/asr/ko_general/v1/valid
model:
  architecture: conformer
training:
  config_path: <ESPNET_RECIPE_CONFIG_PATH>
  max_epoch: 1
resource:
  queue: <CLEARML_QUEUE_NAME>
  gpu_count: 1
output:
  root: asr/espnet-foundation/ko-general-example
